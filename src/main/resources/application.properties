spring.application.name=wallet
# Framework errors (validation, bad JSON, unknown currency) use the same ProblemDetail shape as ours.
spring.mvc.problemdetails.enabled=true
# Session and driver both in UTC, so NOW() in SQL and Instants in Java agree whatever the JVM's zone.
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
# House margin taken off the feed rate on every quote, in basis points.
wallet.fx.spread-bps=50
# 8080 is often taken on dev machines.
server.port=8089
